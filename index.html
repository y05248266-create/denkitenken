    <script>
        // 音響システム (Web Audio API)
        const playSound = (freq = 440, type = 'sine', duration = 0.08) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        };

        const totalSlides = slidesData.length;

        const slideContentEl = document.getElementById('slideContent');
        const currentSlideNumEl = document.getElementById('currentSlideNum');
        const totalSlideNumEl = document.getElementById('totalSlideNum');
        const progressBarEl = document.getElementById('progressBar');
        const dotIndicatorsEl = document.getElementById('dotIndicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indexModal = document.getElementById('indexModal');
        const modalIndexList = document.getElementById('modalIndexList');

        function renderSlide(index) {
            const slide = slidesData[index];
            currentSlideNumEl.textContent = index + 1;
            totalSlideNumEl.textContent = totalSlides;

            const progressPercent = ((index + 1) / totalSlides) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            slideContentEl.className = "slide-enter flex-grow flex flex-col justify-between";
            slideContentEl.innerHTML = `
                <div class="flex-grow flex flex-col">
                    <div class="mb-2">
                        <span class="bg-rose-100 text-rose-900 text-xs font-bold px-3 py-1 rounded-full inline-flex items-center gap-1.5 border border-rose-300">
                            <i class="fa-solid fa-shield-halved text-rose-600"></i>
                            ${slide.tag}
                        </span>
                    </div>
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">
                        ${slide.title}
                    </h2>
                    <p class="text-slate-500 text-xs sm:text-sm mt-1 mb-4 font-medium">
                        ${slide.subtitle}
                    </p>
                    <div class="flex-grow flex flex-col justify-center">
                        ${slide.render()}
                    </div>
                </div>
            `;

            prevBtn.disabled = index === 0;
            if (index === totalSlides - 1) {
                nextBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                nextBtn.classList.add('bg-slate-700', 'hover:bg-slate-800');
            } else {
                nextBtn.classList.remove('bg-slate-700', 'hover:bg-slate-800');
                nextBtn.classList.add('bg-rose-600', 'hover:bg-rose-700');
            }

            updateDots(index);
        }

        function createDots() {
            dotIndicatorsEl.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-200 ${i === currentSlideIndex ? 'bg-rose-600 w-6' : 'bg-slate-300 hover:bg-slate-400'}`;
                dot.title = `スライド ${i + 1}`;
                dot.onclick = () => jumpToSlide(i);
                dotIndicatorsEl.appendChild(dot);
            }
        }

        function updateDots(activeIndex) {
            const dots = dotIndicatorsEl.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].className = "w-6 h-3 bg-rose-600 rounded-full transition-all duration-200";
                } else {
                    dots[i].className = "w-3 h-3 bg-slate-300 hover:bg-slate-400 rounded-full transition-all duration-200";
                }
            }
        }

        function changeSlide(direction) {
            const newIndex = currentSlideIndex + direction;
            if (newIndex >= 0 && newIndex < totalSlides) {
                playSound(500 + direction * 100);
                currentSlideIndex = newIndex;
                renderSlide(currentSlideIndex);
            }
        }

        function jumpToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                playSound(550);
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
                closeIndexModal();
            }
        }

        function openIndexModal() {
            playSound(600);
            modalIndexList.innerHTML = slidesData.map((s, idx) => `
                <button onclick="jumpToSlide(${idx})" class="p-3 text-left rounded-xl border ${idx === currentSlideIndex ? 'border-rose-500 bg-rose-50/80 font-bold' : 'border-slate-200 hover:bg-slate-50'} transition flex items-center justify-between group">
                    <div>
                        <span class="text-xs font-bold text-rose-600 block">${s.tag}</span>
                        <span class="text-sm text-slate-800">${s.title}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-rose-500 transition"></i>
                </button>
            `).join('');

            indexModal.classList.remove('hidden');
            setTimeout(() => indexModal.classList.remove('opacity-0'), 10);
        }

        function closeIndexModal() {
            indexModal.classList.add('opacity-0');
            setTimeout(() => indexModal.classList.add('hidden'), 200);
        }

        function toggleFullscreen() {
            playSound(650);
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.getElementById('fullscreenIcon').className = "fa-solid fa-compress";
                document.getElementById('fullscreenText').textContent = "標準";
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
                document.getElementById('fullscreenIcon').className = "fa-solid fa-expand";
                document.getElementById('fullscreenText').textContent = "大画面";
            }
        }

        document.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') changeSlide(1);
            else if (e.key === 'ArrowLeft') changeSlide(-1);
            else if (e.key === 'Escape') closeIndexModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            createDots();
            renderSlide(currentSlideIndex);
        });
    </script>
</body>
</html>
